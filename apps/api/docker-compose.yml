version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alaska_postgres
    restart: always
    environment:
      POSTGRES_USER: alaska
      POSTGRES_PASSWORD: alaskapassword
      POSTGRES_DB: alaska_local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alaska -d alaska_local']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alaska_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: alaska_pgweb
    restart: always
    ports:
      - '8081:8081'
    environment:
      - DATABASE_URL=postgres://alaska:alaskapassword@postgres:5432/alaska_local?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
