version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alaska_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alaska_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alaska_secret_2026}
      POSTGRES_DB: ${DB_NAME:-alaska_local_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alaska_admin} -d ${DB_NAME:-alaska_local_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alaska_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgres://${DB_USER:-alaska_admin}:${DB_PASSWORD:-alaska_secret_2026}@postgres:5432/${DB_NAME:-alaska_local_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3333:3333"

volumes:
  postgres_data:
