services:
  postgres:
    image: postgres:16-alpine
    container_name: alaska_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alaska}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alaskapassword}
      POSTGRES_DB: ${DB_NAME:-alaska_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alaska} -d ${DB_NAME:-alaska_local}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alaska_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: alaska_pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://${DB_USER:-alaska}:${DB_PASSWORD:-alaskapassword}@postgres:5432/${DB_NAME:-alaska_local}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alaska_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgres://${DB_USER:-alaska}:${DB_PASSWORD:-alaskapassword}@postgres:5432/${DB_NAME:-alaska_local}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3333:3333"

volumes:
  postgres_data:
  redis_data:
