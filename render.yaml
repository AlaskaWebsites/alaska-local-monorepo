services:
  - type: web
    name: alaska-local-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: alaska-local-db
          property: connectionString

databases:
  - name: alaska-local-db
    databaseName: alaska_local
    user: alaska
    plan: free
    region: oregon
